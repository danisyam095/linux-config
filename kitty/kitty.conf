# ============================================================
# KITTY
# JetBrainsMono Nerd Font + Tokyo Night
# Arch Linux / Niri
# ============================================================

# ============================================================
# GLASS / TRANSPARENCY
# ============================================================

background_opacity 0.55
dynamic_background_opacity yes

# ============================================================
# FONT
# ============================================================

font_family JetBrainsMono Nerd Font
bold_font JetBrainsMono Nerd Font Bold
italic_font JetBrainsMono Nerd Font Italic
bold_italic_font JetBrainsMono Nerd Font Bold Italic

font_size 10


# ============================================================
# WINDOW
# ============================================================

hide_window_decorations yes
remember_window_size yes

initial_window_width 120c
initial_window_height 36c

window_padding_width 10

window_border_width 1pt

inactive_text_alpha 0.85

confirm_os_window_close 0


# ============================================================
# CURSOR
# ============================================================

cursor_shape beam

cursor_blink_interval 0.5

cursor_stop_blinking_after 15

cursor #7aa2f7

cursor_text_color #1a1b26


# ============================================================
# SCROLLBACK
# ============================================================

scrollback_lines 10000

wheel_scroll_multiplier 3.0


# ============================================================
# MOUSE
# ============================================================

mouse_hide_wait 3.0

copy_on_select no


# ============================================================
# SHELL
# ============================================================

shell_integration enabled


# ============================================================
# TAB BAR
# ============================================================

tab_bar_edge top

tab_bar_style powerline

tab_bar_align left

tab_bar_min_tabs 2

tab_title_template "{index}  {title}"

active_tab_foreground #1a1b26

active_tab_background #7aa2f7

inactive_tab_foreground #a9b1d6

inactive_tab_background #292e42


# ============================================================
# LAYOUT
# ============================================================

enabled_layouts tall,fat,grid,splits,stack


# ============================================================
# BELL
# ============================================================

enable_audio_bell no

visual_bell_duration 0


# ============================================================
# PERFORMANCE
# ============================================================

repaint_delay 10

input_delay 3

sync_to_monitor yes


# ============================================================
# TOKYO NIGHT
# ============================================================

foreground #a9b1d6

background #1a1b26

selection_foreground #1a1b26

selection_background #7aa2f7


# Black
color0 #15161e
color8 #414868

# Red
color1 #f7768e
color9 #f7768e

# Green
color2 #9ece6a
color10 #9ece6a

# Yellow
color3 #e0af68
color11 #e0af68

# Blue
color4 #7aa2f7
color12 #7aa2f7

# Magenta
color5 #bb9af7
color13 #bb9af7

# Cyan
color6 #7dcfff
color14 #7dcfff

# White
color7 #a9b1d6
color15 #c0caf5


# ============================================================
# BORDERS
# ============================================================

active_border_color #7aa2f7

inactive_border_color #292e42

bell_border_color #f7768e


# ============================================================
# KITTY KEYBINDINGS
# ============================================================

kitty_mod ctrl+shift


# New window
map kitty_mod+enter new_window


# New tab
map kitty_mod+t new_tab


# Close window
map kitty_mod+w close_window


# Next tab
map kitty_mod+right next_tab


# Previous tab
map kitty_mod+left previous_tab


# Move tab
map kitty_mod+shift+right move_tab_forward

map kitty_mod+shift+left move_tab_backward


# Font size +
map kitty_mod+equal change_font_size all +2.0


# Font size -
map kitty_mod+minus change_font_size all -2.0


# Reset font size
map kitty_mod+backspace change_font_size all 0


# Scroll up
map kitty_mod+page_up scroll_page_up


# Scroll down
map kitty_mod+page_down scroll_page_down


# Scroll top
map kitty_mod+home scroll_home


# Scroll bottom
map kitty_mod+end scroll_end


# Next layout
map kitty_mod+l next_layout
